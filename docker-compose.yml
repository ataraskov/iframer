services:
  iframer:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ALLOWED_HOSTS: "glosbe.com"
      REQUEST_TIMEOUT_MS: "15000"
      ADBLOCK_ENABLED: "true"
    volumes:
      - adblock-cache:/app/.cache
    restart: unless-stopped

volumes:
  adblock-cache:
